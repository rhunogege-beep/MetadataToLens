[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MetadataToLens"
version = "0.1.0"
description = "Automatic Camera & Lens Metadata Pipeline for Nuke"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "MetadataToLens Contributors"}
]
keywords = [
    "nuke",
    "metadata",
    "camera",
    "lens",
    "arri",
    "red",
    "vfx",
    "pipeline"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.urls]
Homepage = "https://github.com/rhunogege-beep/MetadataToLens"
Documentation = "https://github.com/rhunogege-beep/MetadataToLens#readme"
Repository = "https://github.com/rhunogege-beep/MetadataToLens.git"
Issues = "https://github.com/rhunogege-beep/MetadataToLens/issues"

[tool.setuptools]
packages = ["metadata_to_lens", "metadata_to_lens.ui", "metadata_to_lens.database"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.pylint]
max-line-length = 100
disable = ["C0111", "R0903"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["metadata_to_lens"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
